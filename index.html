<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F8F7F4; --panel:#FFFFFF; --ink:#1B2431; --sub:#5B6472; --line:#E4E1D9;
    --navy:#20304D; --teal:#0E7C7B; --amber:#B8791C; --rose:#B5402B; --green:#1E7A46;
    --chip-new:#EFF2F6; --chip-new-ink:#33455E;
    --chip-contacted:#EAF2F1; --chip-contacted-ink:#0E5F5E;
    --chip-follow:#FAF1E3; --chip-follow-ink:#8A5A12;
    --chip-enrolled:#EAF5EC; --chip-enrolled-ink:#175C33;
    --chip-lost:#F7EBE8; --chip-lost-ink:#93321F;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181F; --panel:#1B2029; --ink:#EDEFF3; --sub:#9AA2B1; --line:#2A303B;
      --chip-new:#232A36; --chip-new-ink:#B9C4D6;
      --chip-contacted:#1D2E2C; --chip-contacted-ink:#7FCFC8;
      --chip-follow:#2C2416; --chip-follow-ink:#E0AC5C;
      --chip-enrolled:#17281C; --chip-enrolled-ink:#7FCB94;
      --chip-lost:#2A1D1A; --chip-lost-ink:#E19A88;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181F; --panel:#1B2029; --ink:#EDEFF3; --sub:#9AA2B1; --line:#2A303B;
    --chip-new:#232A36; --chip-new-ink:#B9C4D6;
    --chip-contacted:#1D2E2C; --chip-contacted-ink:#7FCFC8;
    --chip-follow:#2C2416; --chip-follow-ink:#E0AC5C;
    --chip-enrolled:#17281C; --chip-enrolled-ink:#7FCB94;
    --chip-lost:#2A1D1A; --chip-lost-ink:#E19A88;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  .wrap{max-width:1080px; margin:0 auto; padding:28px 20px 60px;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .brand{font-size:22px; font-weight:700; letter-spacing:-0.01em; color:var(--navy);}
  .brand small{display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:12.5px; color:var(--sub); margin-top:2px;}

  .reminder-banner{background:var(--chip-lost); color:var(--chip-lost-ink); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:10px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .stat .n{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; line-height:1;}
  .stat .l{font-size:12px; color:var(--sub); margin-top:6px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px;}
  .panel h2{font-size:15px; margin:0 0 14px; font-weight:600; color:var(--ink);}

  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; align-items:end;}
  .form-grid button{align-self:end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; color:var(--sub);}
  input,select,textarea{
    font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  button{
    font:inherit; border:none; border-radius:8px; padding:9px 14px; cursor:pointer;
    font-weight:600; transition:filter .12s ease;
  }
  button:hover{filter:brightness(0.94);}
  button:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-wa{background:#1E7A46; color:#fff; font-size:12.5px; padding:6px 10px;}
  .btn-sm{font-size:12.5px; padding:6px 10px;}
  .btn-danger{background:transparent; color:var(--rose); border:1px solid var(--line);}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap;}
  .filters button{background:var(--bg); border:1px solid var(--line); color:var(--sub); font-size:12.5px; padding:6px 12px;}
  .filters button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .actions-right{display:flex; gap:8px; flex-wrap:wrap;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; color:var(--sub); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap;}
  th:hover{color:var(--ink);}
  th.sorted{color:var(--teal);}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .lead-name{font-weight:600;}
  .lead-phone{color:var(--sub); font-size:12.5px;}
  .tag-row{margin-top:4px;}
  .tag-chip{display:inline-block; background:var(--chip-new); color:var(--chip-new-ink); font-size:10px; padding:2px 7px; border-radius:10px; margin:2px 4px 0 0;}
  .chip{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap;}
  .chip.new{background:var(--chip-new); color:var(--chip-new-ink);}
  .chip.contacted{background:var(--chip-contacted); color:var(--chip-contacted-ink);}
  .chip.followup{background:var(--chip-follow); color:var(--chip-follow-ink);}
  .chip.enrolled{background:var(--chip-enrolled); color:var(--chip-enrolled-ink);}
  .chip.lost{background:var(--chip-lost); color:var(--chip-lost-ink);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .empty{text-align:center; padding:40px 20px; color:var(--sub);}
  .notes-cell{max-width:180px; color:var(--sub); font-size:12.5px;}
  select.status-select{font-size:12.5px; padding:5px 7px;}
  @media (max-width:820px){
    .form-grid .field.wide-mobile{grid-column:1/-1;}
    .src-row{grid-template-columns:90px 1fr !important;}
    .src-count{grid-column:1/-1; text-align:left !important;}
  }
  .update-cell{max-width:190px;}
  .update-text{font-size:12.5px; color:var(--ink);}
  .update-date{font-size:11px; color:var(--sub); margin-top:2px;}
  .btn-log{background:transparent; border:1px solid var(--line); color:var(--navy); font-size:12px; padding:5px 9px;}
  .overlay{position:fixed; inset:0; background:rgba(20,24,31,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .overlay[hidden]{display:none;}
  .modal{background:var(--panel); border-radius:12px; border:1px solid var(--line); width:100%; max-width:460px; max-height:85vh; display:flex; flex-direction:column; padding:18px;}
  .modal h3{margin:0 0 4px; font-size:16px; font-family:'Space Grotesk',sans-serif;}
  .modal .sub{font-size:12.5px; color:var(--sub); margin-bottom:12px;}
  .log-list{overflow-y:auto; flex:1; margin-bottom:12px; border-top:1px solid var(--line); padding-top:10px;}
  .log-entry{padding:8px 0; border-bottom:1px solid var(--line);}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .d{font-size:11px; color:var(--sub); font-weight:600;}
  .log-entry .t{font-size:13px; margin-top:2px;}
  .log-empty{font-size:12.5px; color:var(--sub); padding:10px 0;}
  .log-add{display:flex; gap:8px; align-items:flex-end;}
  .log-add textarea{resize:vertical; min-height:38px;}
  .log-add .field{flex:1;}
  .modal-footer{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px;}
  .fu-badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap;}
  .fu-overdue{background:var(--chip-lost); color:var(--chip-lost-ink);}
  .fu-today{background:var(--chip-follow); color:var(--chip-follow-ink);}
  .fu-upcoming{background:var(--chip-new); color:var(--chip-new-ink);}
  .fu-none{color:var(--sub); font-size:12px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px;}
  .detail-grid .field{grid-column:span 1;}
  .detail-grid .field.wide{grid-column:1/-1;}
  .save-row{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .wa-select{font-size:12px; padding:4px 6px; max-width:120px;}
  .src-row{display:grid; grid-template-columns:110px 1fr 150px; gap:10px; align-items:center; margin-bottom:9px;}
  .src-label{font-size:12.5px; font-weight:600;}
  .src-bar-wrap{background:var(--bg); border-radius:6px; height:10px; overflow:hidden; border:1px solid var(--line);}
  .src-bar{background:var(--teal); height:100%; border-radius:6px;}
  .src-count{font-size:11.5px; color:var(--sub); text-align:right; white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Lead Tracker<small id="syncStatus">Connecting…</small></div>
    <div class="actions-right">
      <button class="btn-ghost btn-sm" id="themeBtn">🌓 Auto</button>
      <button class="btn-ghost btn-sm" id="exportBtn">Export CSV</button>
      <label class="btn-ghost btn-sm" style="cursor:pointer;">Import CSV<input type="file" id="importFile" accept=".csv" style="display:none;"></label>
    </div>
  </header>

  <div class="reminder-banner" id="reminderBanner" hidden></div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2>Lead sources</h2>
    <div id="analytics"></div>
  </div>

  <div class="panel">
    <h2>Add a lead</h2>
    <div class="form-grid">
      <div class="field"><label for="fName">Name</label><input id="fName" placeholder="Lead name"></div>
      <div class="field"><label for="fPhone">WhatsApp number</label><input id="fPhone" placeholder="+91 98765 43210"></div>
      <div class="field"><label for="fSource">Source</label><input id="fSource" placeholder="Ad / Referral / Walk-in"></div>
      <div class="field"><label for="fDate">Date added</label><input type="date" id="fDate"></div>
      <div class="field"><label for="fStatus">Status</label>
        <select id="fStatus">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="followup">Follow-up</option>
          <option value="enrolled">Enrolled</option>
          <option value="lost">Not enrolled</option>
        </select>
      </div>
      <div class="field"><label for="fNext">Next follow-up</label><input type="date" id="fNext"></div>
      <button class="btn-primary" id="addBtn">Add lead</button>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <input id="search" placeholder="Search name, phone or tag" style="max-width:220px;">
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-key="name">Lead ⇅</th>
            <th data-key="source">Source ⇅</th>
            <th data-key="status">Status ⇅</th>
            <th data-key="followup">Follow-up ⇅</th>
            <th data-key="update">Latest update ⇅</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">No leads yet. Add your first lead above, or import a CSV.</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h3 id="modalName">Lead details</h3>
    <div class="sub" id="modalPhone">Edit info, set a follow-up date, and log what happens each day.</div>
    <div class="detail-grid">
      <div class="field"><label for="mName">Name</label><input id="mName"></div>
      <div class="field"><label for="mPhone">WhatsApp number</label><input id="mPhone"></div>
      <div class="field"><label for="mSource">Source</label><input id="mSource"></div>
      <div class="field"><label for="mStatus">Status</label>
        <select id="mStatus">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="followup">Follow-up</option>
          <option value="enrolled">Enrolled</option>
          <option value="lost">Not enrolled</option>
        </select>
      </div>
      <div class="field wide"><label for="mNext">Next follow-up</label><input type="date" id="mNext"></div>
      <div class="field wide"><label for="mTags">Tags (comma separated)</label><input id="mTags" placeholder="Hot lead, Budget conscious"></div>
    </div>
    <div class="save-row"><button class="btn-ghost btn-sm" id="saveDetails">Save details</button></div>
    <div class="log-list" id="logList"></div>
    <div class="log-add">
      <div class="field"><label for="logDate">Date</label><input type="date" id="logDate"></div>
      <div class="field"><label for="logText">What happened today</label><textarea id="logText" placeholder="Called, said will confirm by Friday..."></textarea></div>
      <button class="btn-primary btn-sm" id="logAddBtn">Add</button>
    </div>
    <div class="modal-footer">
      <a class="btn-wa btn-sm" style="text-decoration:none;" id="modalWaLink" href="#" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn-ghost btn-sm" id="closeModal">Close</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'lead_tracker_leads_v1';
const THEME_KEY = 'lead_tracker_theme_v1';
const STATUS_META = {
  new:{label:'New', chip:'new'},
  contacted:{label:'Contacted', chip:'contacted'},
  followup:{label:'Follow-up', chip:'followup'},
  enrolled:{label:'Enrolled', chip:'enrolled'},
  lost:{label:'Not enrolled', chip:'lost'}
};
const STATUS_TEMPLATES = {
  new: (name)=> `Hi ${name}, thanks for reaching out! Just following up on your enquiry.`,
  contacted: (name)=> `Hi ${name}, just checking in — did you have any questions after we spoke?`,
  followup: (name)=> `Hi ${name}, following up as discussed. Let me know if you're ready to move forward!`,
  enrolled: (name)=> `Hi ${name}, welcome aboard! Excited to have you enrolled.`,
  lost: (name)=> `Hi ${name}, thanks for considering us. Feel free to reach out anytime in the future.`
};
let leads = [];
let activeFilter = 'all';
let openLeadId = null;
let sortKey = null;
let sortDir = 1;
let db = null;
let leadsCollection = null;

// ⚠️ PASTE YOUR FIREBASE CONFIG HERE (from Firebase console → Project settings → Your apps)
const firebaseConfig = {
  apiKey: "AIzaSyBAr-YRojPQgBmF2NxEsJQNJ1U0DqYQuQk",
  authDomain: "lead-tracker-8e52a.firebaseapp.com",
  projectId: "lead-tracker-8e52a",
  storageBucket: "lead-tracker-8e52a.firebasestorage.app",
  messagingSenderId: "437810555285",
  appId: "1:437810555285:web:e5eaf25d60a6fab7b62e9c"
};

function initFirebase(){
  const statusEl = document.getElementById('syncStatus');
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    leadsCollection = db.collection('leads');
  }catch(e){
    statusEl.textContent = 'Setup needed — add your Firebase config in the code';
    console.error('Firebase init failed', e);
    leads = loadLocalBackup();
    renderAll();
    return;
  }

  db.enablePersistence({synchronizeTabs:true}).catch(err=>{
    console.warn('Offline persistence not enabled:', err.code);
  });

  leadsCollection.onSnapshot(
    { includeMetadataChanges: true },
    (snapshot) => {
      leads = snapshot.docs.map(d => d.data());
      const pending = snapshot.metadata.hasPendingWrites;
      const fromCache = snapshot.metadata.fromCache;
      if(fromCache && pending){
        statusEl.textContent = '⚠ Offline — saved on this device, will sync when online';
      } else if(fromCache){
        statusEl.textContent = '⚠ Offline — showing last saved data';
      } else if(pending){
        statusEl.textContent = 'Saving…';
      } else {
        statusEl.textContent = 'Synced ✓ (all devices)';
      }
      saveLocalBackup();
      renderAll();
    },
    (err) => {
      console.error('Firestore sync error', err);
      statusEl.textContent = '⚠ Connection issue — showing last saved data';
      leads = loadLocalBackup();
      renderAll();
    }
  );
}

function saveLocalBackup(){
  try{ localStorage.setItem('lead_tracker_backup_v1', JSON.stringify(leads)); }
  catch(e){ console.error('Backup save failed', e); }
}
function loadLocalBackup(){
  try{
    const raw = localStorage.getItem('lead_tracker_backup_v1');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function saveLead(lead){
  if(!leadsCollection){ alert('Not connected to the database yet. Check your Firebase config.'); return; }
  leadsCollection.doc(lead.id).set(lead).catch(e=>{
    console.error('Could not save lead', e);
    alert('Could not save — check your internet connection.');
  });
}
function deleteLeadRemote(id){
  if(!leadsCollection) return;
  leadsCollection.doc(id).delete().catch(e=>{
    console.error('Could not delete lead', e);
    alert('Could not delete — check your internet connection.');
  });
}
function uid(){ return 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function cleanPhone(p){ return (p||'').replace(/[^0-9+]/g,''); }
function waLink(phone, name, status){
  const num = cleanPhone(phone).replace(/^\+/, '');
  const templateFn = STATUS_TEMPLATES[status] || STATUS_TEMPLATES.new;
  const msg = encodeURIComponent(templateFn(name || ''));
  return `https://wa.me/${num}?text=${msg}`;
}

/* ---------- Theme ---------- */
function applyTheme(t){
  if(t === 'auto'){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme', t); }
  document.getElementById('themeBtn').textContent = t === 'light' ? '☀️ Light' : t === 'dark' ? '🌙 Dark' : '🌓 Auto';
  localStorage.setItem(THEME_KEY, t);
}
function loadTheme(){ applyTheme(localStorage.getItem(THEME_KEY) || 'auto'); }
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  const next = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  applyTheme(next);
});

/* ---------- Stats & Reminders ---------- */
function renderStats(){
  const el = document.getElementById('stats');
  const total = leads.length;
  const counts = {new:0,contacted:0,followup:0,enrolled:0,lost:0};
  leads.forEach(l => { if(counts[l.status]!==undefined) counts[l.status]++; });
  const overdue = leads.filter(l => followUpRank(l) < 0).length;
  const rate = total ? Math.round((counts.enrolled/total)*100) : 0;
  el.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total leads</div></div>
    <div class="stat"><div class="n" style="color:${overdue?'var(--rose)':'inherit'}">${overdue}</div><div class="l">Overdue follow-ups</div></div>
    <div class="stat"><div class="n">${counts.enrolled}</div><div class="l">Enrolled</div></div>
    <div class="stat"><div class="n">${rate}%</div><div class="l">Enrollment rate</div></div>
  `;
}
function renderReminder(){
  const el = document.getElementById('reminderBanner');
  const overdue = leads.filter(l=>followUpRank(l)<0).length;
  const today = leads.filter(l=>followUpRank(l)===0).length;
  if(overdue+today===0){ el.hidden = true; return; }
  const parts = [];
  if(overdue) parts.push(`${overdue} overdue`);
  if(today) parts.push(`${today} due today`);
  el.hidden = false;
  el.innerHTML = `<span>⏰ ${parts.join(' · ')} follow-up${(overdue+today)>1?'s':''}</span><button class="btn-ghost btn-sm" id="dismissReminder">Dismiss</button>`;
  document.getElementById('dismissReminder').addEventListener('click', ()=>{ el.hidden = true; });
}
/* ---------- Analytics ---------- */
function renderAnalytics(){
  const el = document.getElementById('analytics');
  const bySource = {};
  leads.forEach(l=>{
    const src = l.source || 'Unknown';
    if(!bySource[src]) bySource[src] = {total:0, enrolled:0};
    bySource[src].total++;
    if(l.status==='enrolled') bySource[src].enrolled++;
  });
  const entries = Object.entries(bySource).sort((a,b)=> b[1].total - a[1].total);
  if(!entries.length){ el.innerHTML = '<div style="color:var(--sub); font-size:12.5px;">No leads yet to analyze.</div>'; return; }
  const maxTotal = Math.max(...entries.map(e=>e[1].total));
  el.innerHTML = entries.map(([src, d])=>{
    const pct = maxTotal ? Math.round((d.total/maxTotal)*100) : 0;
    const rate = d.total ? Math.round((d.enrolled/d.total)*100) : 0;
    return `
      <div class="src-row">
        <div class="src-label">${escapeHtml(src)}</div>
        <div class="src-bar-wrap"><div class="src-bar" style="width:${pct}%"></div></div>
        <div class="src-count">${d.total} lead${d.total>1?'s':''} · ${rate}% enrolled</div>
      </div>`;
  }).join('');
}

/* ---------- Filters ---------- */
function renderFilters(){
  const el = document.getElementById('filters');
  const opts = [['all','All'], ...Object.entries(STATUS_META).map(([k,v])=>[k,v.label])];
  el.innerHTML = opts.map(([k,label]) =>
    `<button data-filter="${k}" class="${activeFilter===k?'active':''}">${label}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ activeFilter = b.dataset.filter; renderFilters(); renderTable(); });
  });
}

/* ---------- Sorting helpers ---------- */
function followUpRank(l){
  if(!l.nextFollowUp) return Infinity;
  const days = Math.floor((new Date(l.nextFollowUp+'T00:00:00') - startOfToday())/86400000);
  return days;
}
function startOfToday(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function latestUpdateDate(l){
  const logs = l.logs || [];
  if(!logs.length) return '';
  return logs.slice().sort((a,b)=> b.date.localeCompare(a.date))[0].date;
}
function sortValue(l, key){
  switch(key){
    case 'name': return (l.name||'').toLowerCase();
    case 'source': return (l.source||'').toLowerCase();
    case 'status': return l.status||'';
    case 'followup': { const r = followUpRank(l); return r===Infinity ? 999999 : r; }
    case 'update': return latestUpdateDate(l);
    default: return '';
  }
}

/* ---------- Table ---------- */
function renderTable(){
  const tbody = document.getElementById('tbody');
  const searchVal = document.getElementById('search').value.trim().toLowerCase();
  let rows = leads.slice();

  if(sortKey){
    rows.sort((a,b)=>{
      const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
      if(av < bv) return -1 * sortDir;
      if(av > bv) return 1 * sortDir;
      return 0;
    });
  } else {
    rows.sort((a,b)=> followUpRank(a) - followUpRank(b) || b.createdAt - a.createdAt);
  }

  if(activeFilter !== 'all') rows = rows.filter(l => l.status === activeFilter);
  if(searchVal) rows = rows.filter(l =>
    (l.name||'').toLowerCase().includes(searchVal) ||
    (l.phone||'').includes(searchVal) ||
    (l.tags||[]).some(t => t.toLowerCase().includes(searchVal))
  );

  document.querySelectorAll('th[data-key]').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key === sortKey);
  });

  document.getElementById('emptyMsg').style.display = rows.length ? 'none' : 'block';
  tbody.innerHTML = rows.map(l => {
    const tagsHtml = (l.tags && l.tags.length)
      ? `<div class="tag-row">${l.tags.map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : '';
    return `
    <tr data-id="${l.id}">
      <td><div class="lead-name">${escapeHtml(l.name)}</div><div class="lead-phone">${escapeHtml(l.phone)}</div>${tagsHtml}</td>
      <td>${escapeHtml(l.source)||'—'}</td>
      <td>
        <select class="status-select" data-id="${l.id}">
          ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${k===l.status?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </td>
      <td>${followUpBadge(l)}</td>
      <td class="update-cell">${latestUpdateHtml(l)}</td>
      <td>
        <div class="row-actions">
          <a class="btn-wa" style="text-decoration:none; display:inline-block;" href="${waLink(l.phone,l.name,l.status)}" target="_blank" rel="noopener">WhatsApp</a>
          <button class="btn-log" data-log="${l.id}">Open</button>
          <button class="btn-danger btn-sm" data-del="${l.id}">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('select.status-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const lead = leads.find(x=>x.id===sel.dataset.id);
      if(lead){ lead.status = sel.value; saveLead(lead); }
    });
  });
  tbody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Delete this lead? This cannot be undone.')) return;
      deleteLeadRemote(btn.dataset.del);
    });
  });
  tbody.querySelectorAll('[data-log]').forEach(btn=>{
    btn.addEventListener('click', ()=> openLogModal(btn.dataset.log));
  });
}
document.querySelectorAll('th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    renderTable();
  });
});

function followUpBadge(l){
  if(!l.nextFollowUp) return '<span class="fu-none">Not set</span>';
  const days = followUpRank(l);
  const label = formatDate(l.nextFollowUp);
  if(days < 0) return `<span class="fu-badge fu-overdue">Overdue · ${label}</span>`;
  if(days === 0) return `<span class="fu-badge fu-today">Today · ${label}</span>`;
  return `<span class="fu-badge fu-upcoming">${label}</span>`;
}
function latestUpdateHtml(l){
  const logs = l.logs || [];
  if(!logs.length) return '<span style="color:var(--sub); font-size:12.5px;">No updates yet</span>';
  const last = logs.slice().sort((a,b)=> b.date.localeCompare(a.date))[0];
  return `<div class="update-text">${escapeHtml(last.text)}</div><div class="update-date">${formatDate(last.date)}</div>`;
}
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString();
}

/* ---------- Modal ---------- */
function openLogModal(id){
  openLeadId = id;
  const lead = leads.find(x=>x.id===id);
  if(!lead) return;
  document.getElementById('modalName').textContent = lead.name || 'Lead details';
  document.getElementById('mName').value = lead.name || '';
  document.getElementById('mPhone').value = lead.phone || '';
  document.getElementById('mSource').value = lead.source || '';
  document.getElementById('mStatus').value = lead.status || 'new';
  document.getElementById('mNext').value = lead.nextFollowUp || '';
  document.getElementById('mTags').value = (lead.tags||[]).join(', ');
  document.getElementById('logDate').value = todayIso();
  document.getElementById('logText').value = '';
  document.getElementById('modalWaLink').href = waLink(lead.phone, lead.name, lead.status);
  renderLogList();
  document.getElementById('overlay').hidden = false;
}
document.getElementById('saveDetails').addEventListener('click', ()=>{
  const lead = leads.find(x=>x.id===openLeadId);
  if(!lead) return;
  lead.name = document.getElementById('mName').value.trim() || lead.name;
  lead.phone = document.getElementById('mPhone').value.trim() || lead.phone;
  lead.source = document.getElementById('mSource').value.trim();
  lead.status = document.getElementById('mStatus').value;
  lead.nextFollowUp = document.getElementById('mNext').value || '';
  lead.tags = document.getElementById('mTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  saveLead(lead);
  openLogModal(lead.id);
});
function renderLogList(){
  const lead = leads.find(x=>x.id===openLeadId);
  const el = document.getElementById('logList');
  if(!lead){ el.innerHTML=''; return; }
  const logs = (lead.logs||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
  el.innerHTML = logs.length ? logs.map(entry => `
    <div class="log-entry"><div class="d">${formatDate(entry.date)}</div><div class="t">${escapeHtml(entry.text)}</div></div>
  `).join('') : '<div class="log-empty">No day-by-day updates yet. Add the first one below.</div>';
}
function todayIso(){ return new Date().toISOString().slice(0,10); }

document.getElementById('logAddBtn').addEventListener('click', ()=>{
  const lead = leads.find(x=>x.id===openLeadId);
  if(!lead) return;
  const date = document.getElementById('logDate').value || todayIso();
  const text = document.getElementById('logText').value.trim();
  if(!text){ alert('Please type what happened.'); return; }
  lead.logs = lead.logs || [];
  lead.logs.push({ date, text });
  saveLead(lead);
  document.getElementById('logText').value = '';
  renderLogList();
});
document.getElementById('closeModal').addEventListener('click', ()=>{
  document.getElementById('overlay').hidden = true;
  openLeadId = null;
});
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay'){ document.getElementById('overlay').hidden = true; openLeadId = null; }
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){ renderStats(); renderReminder(); renderAnalytics(); renderFilters(); renderTable(); }

/* ---------- Add lead (with duplicate detection) ---------- */
document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const source = document.getElementById('fSource').value.trim();
  const status = document.getElementById('fStatus').value;
  const dateVal = document.getElementById('fDate').value;
  const nextVal = document.getElementById('fNext').value;
  if(!name || !phone){ alert('Name and WhatsApp number are needed.'); return; }

  const cleanedNew = cleanPhone(phone);
  const dup = cleanedNew ? leads.find(l => cleanPhone(l.phone) === cleanedNew) : null;
  if(dup){
    const cont = confirm(`A lead with this number already exists: "${dup.name}". Add anyway?`);
    if(!cont) return;
  }

  const createdAt = dateVal ? new Date(dateVal + 'T12:00:00').getTime() : Date.now();
  saveLead({ id:uid(), name, phone, source, status, notes:'', tags:[], logs:[], nextFollowUp: nextVal||'', createdAt });
  document.getElementById('fName').value='';
  document.getElementById('fPhone').value='';
  document.getElementById('fSource').value='';
  document.getElementById('fDate').value='';
  document.getElementById('fNext').value='';
  document.getElementById('fStatus').value='new';
  renderAll();
});

document.getElementById('search').addEventListener('input', renderTable);

/* ---------- Export / Import ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const header = ['Name','Phone','Source','Status','Next Follow-up','Tags','Latest Update','Added'];
  const rows = leads.map(l => {
    const logs = (l.logs||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
    const latest = logs.length ? `${logs[0].date}: ${logs[0].text}` : '';
    return [
      l.name, l.phone, l.source||'', (STATUS_META[l.status]||{}).label || l.status, l.nextFollowUp||'',
      (l.tags||[]).join('; '), latest, new Date(l.createdAt).toLocaleDateString()
    ];
  });
  const csv = [header, ...rows].map(r =>
    r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'leads.csv'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = reader.result;
      const lines = text.split(/\r?\n/).filter(Boolean);
      const dataLines = lines.slice(1);
      const statusByLabel = Object.fromEntries(Object.entries(STATUS_META).map(([k,v])=>[v.label.toLowerCase(),k]));
      let skipped = 0;
      const toImport = [];
      dataLines.forEach(line => {
        const cells = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const clean = cells.map(c => c.replace(/^"|"$/g,'').replace(/""/g,'"'));
        const [name, phone, source, statusLabel, nextFollowUp, tagsStr, latestUpdate] = clean;
        if(!name) return;
        const cleanedPhone = cleanPhone(phone);
        if(cleanedPhone && leads.find(l => cleanPhone(l.phone) === cleanedPhone)){ skipped++; return; }
        const status = statusByLabel[(statusLabel||'').toLowerCase()] || 'new';
        const tags = (tagsStr||'').split(';').map(t=>t.trim()).filter(Boolean);
        const logs = [];
        if(latestUpdate && latestUpdate.includes(':')){
          const idx = latestUpdate.indexOf(':');
          const d = latestUpdate.slice(0,idx).trim();
          const t = latestUpdate.slice(idx+1).trim();
          logs.push({ date: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : todayIso(), text: t });
        }
        toImport.push({ id:uid(), name, phone:phone||'', source:source||'', status, notes:'', tags, logs, nextFollowUp: nextFollowUp||'', createdAt: Date.now() });
      });
      if(toImport.length && db){
        const batch = db.batch();
        toImport.forEach(nl => batch.set(leadsCollection.doc(nl.id), nl));
        batch.commit().catch(e=>{ console.error(e); alert('Some rows could not be imported — check your internet connection.'); });
      }
      if(skipped) alert(`Imported ${toImport.length} lead(s). Skipped ${skipped} row(s) with phone numbers already in your list.`);
    }catch(err){ alert('Could not read that CSV file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

loadTheme();
initFirebase();
</script>
